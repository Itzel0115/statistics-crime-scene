 1:{short:d=>`十月的星期一，政大校園多處販賣機的同一套營運服務引起爭議。兩個完整統計週的購物客訴件數，由 ${d.complaints[0]} 件增至 ${d.complaints[1]} 件。學生要求撤換設備，校方準備檢討合約。協調會前，一份新聞未附的營運紀錄送到調查桌上；你得先查清楚數字，才能提出建議。`,

 2:{short:d=>`教育評鑑委員會公布年度能力測驗通過率初榜：達所應試題組及格標準的人數，除以實際應試人數。星橋學院（A）${pct(overall(d,0))}，晨星學院（B）${pct(overall(d,1))}；星橋列入補助優先推薦草案。核定前，一封匿名信送到：「你們把兩種不同難度的測驗混在一起比了。」`,
 detailTitle:'尚未核定的推薦草案',source:'教育評鑑委員會 / 委託附件',fictionShort:'虛構統計教學情境。',fiction:'學院、委員會、情節及數據均為虛構教學設定。',

 question:'只看總榜，你會把哪一所寫進推薦報告？',choices:['推薦星橋','想先看分組資料','暫不推薦'],director:'榜單只告訴我有幾個人及格。可兩所學院考的是同一種題目嗎？',verdict:'哪一個被忽略的差異，改寫了總榜的名次？',resultTitle:'推薦暫緩，補列分組',outcome:'委員會暫緩推薦核定，要求原始總榜、分組結果與題組結構並列，再審議補助政策。晨星的異議正式附入審查紀錄。',after:'要求總榜併列難度與組成，不以排名斷言教學優劣。',closing:'草案後面，多了兩張分組表。',waiting:'補助推薦仍是草案，委員會等你核對。',titles:{letter:'榜單公布後的匿名信',roster:'被折起一角的參加者名冊',config:'兩校題組配置清冊'},discoveries:{letter:'信上只留了一句指控。要核實它，得向測驗中心借名冊。',roster:'折角展開了。題組難度，把總榜切成兩張表。',config:'兩校的人數一樣多，考的題組卻分配得很不一樣。'},rejection:'局長在榜單邊緣寫下：「分組能力測驗通過率沒變，變的是加起來時的權重。至於教學造成了什麼，你有其他證據嗎？」',supportReturn:'局長翻了一遍附件：「只有總榜，說明不了組成差異。把分組能力測驗通過率與配置表都列為證據。」'},
 3:{short:d=>`NeuroWave 即將推出 Focus-X 耳機，宣稱聲波能提升記憶。研究摘要中，模式 A 的記憶測驗平均分數比對照組高 ${num(d.study.mean[0]-d.study.mean[1],1)} 分，p = ${d.pvalues[0].toFixed(3)}。行銷部已把「科學證實有效」印進廣告。上市前，你受託核對宣稱；摘要右上角的 FX-A 編號，值得追查。`,
 detailTitle:'上市前的宣稱核對',source:'NeuroWave / 研究與宣傳委託',fictionShort:'虛構統計教學情境。',fiction:'公司、產品、研究及往來文件均為虛構教學設定。',
 detail:d=>`<p>NeuroWave 在上市前安排受試者完成記憶測驗，再比較 Focus-X 聲波模式與對照條件下的分數。這份資料使用兩組獨立受試者；模式 A 平均分數比對照組高 ${num(d.study.mean[0]-d.study.mean[1],1)} 分。</p><p>摘要所列 p = ${d.pvalues[0].toFixed(3)}，來自這項記憶測驗平均分數差異的檢定。平均差與 p 值不是同一個量，也不能把廣告上的「科學證實有效」直接當作研究結論。</p><p>摘要只公布 A，沒有交代完整研究流程。公司委託你在廣告發布前核對宣稱。研究員說，若要找原始附件，可從右上角的檔案編號 FX-A 查起。</p>`,
 question:'廣告能寫「科學證實有效」嗎？',choices:['可以發布','先看完整研究紀錄','目前不能判定'],director:'先別急著說結果錯了。去找找這份摘要的前一頁、後一頁，有沒有其他紀錄。',verdict:'真正讓「科學證實」失去說服力的，是哪一段研究流程？',resultTitle:'上市宣稱，退回修正',outcome:'NeuroWave 收到修正建議：公開完整測試，撤下「科學證實有效」的過度宣稱，安排預先指定主要假設的獨立確認研究。',after:'目前不足以宣稱已證實有效；安排新的確認性實驗。',closing:'公開摘要旁，現在附上了完整研究日誌。',waiting:'耳機的上市文案，正在等最後核稿。',titles:{summary:'上市新聞稿的研究附件',log:'資料櫃裡的完整試驗日誌',memo:'研究部與行銷部的往返信件'},discoveries:{summary:'摘要右上角的 FX-A 編號，還沒有查過。',log:'資料櫃打開了。A 後面，還排著 B 到 L。',memo:'信件寄出時，所有試驗都已完成。發表版本是事後挑的。'},rejection:'局長退回報告：「一個小於 0.05 的數字，回答不了十二次比較一起造成的風險。把研究流程寫進去。」',supportReturn:'局長敲了敲附件欄：「完整日誌告訴我們做了什麼，內部通訊交代怎麼挑的。兩份都得列為證據。」'}

function opinionLabel(id,value){const at=['同意','存疑','不確定'].indexOf(value);return at<0?'尚未留下意見':(STORY[id]?.choices||['同意','存疑','不確定'])[at];}
function directorNote(text){return '<blockquote class="director-note">'+text+'<cite>—— 局長</cite></blockquote>';}
function director(){const id=gameState.activeCase,p=progress();let text=STORY[id].director;
 if(id===1&&p.evidenceIds.includes('transactions'))text='兩週的購物客訴件數與交易筆數，範圍對得上。現在，把它們放在一起比較。';
 if(id===2&&p.evidenceIds.includes('roster'))text='分組裡誰比較高？兩校又各有多少人考了哪一組？這兩個問題得一起回答。';
 if(id===3&&p.evidenceIds.includes('log'))text='若每一次都以 0.05 當門檻，嘗試愈多次，碰巧過線的機會也會累積。';
 openModal('director','局長的批註',directorNote(text)+'<div class="doc-actions"><button class="secondary" data-action="close">收起便條</button></div>','memo');
}
function folderSide(side){gameState.ui.folderSide=side;const viewport=document.querySelector('.folder-viewport');if(viewport){viewport.scrollLeft=side==='left'?0:viewport.scrollWidth-viewport.clientWidth;document.querySelectorAll('[data-action="folder-side"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.side===side));}}

const STORAGE_KEY='statistics-crime-scene-v1';
const asset=name=>'./asset/optimized/'+name+'.webp';
const pad=id=>String(id).padStart(3,'0');
const num=(n,d=0)=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=n=>num(n*100,Number.isInteger(Math.round(n*100000)/1000)?0:1)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({initialOpinion:null,evidenceIds:[],selected:[],flags:[],analyzed:false,solved:false,hintLevel:0,weight:CASE_DATA[2].defaultWeight,view:'original'});
const gameState={scene:'intro',activeCase:null,caseProgress:{1:fresh(),2:fresh(),3:fresh()},ui:{modal:null},selectedEvidenceIds:[]};
let storageAvailable=true,toastTimer,stampTimer,modalFocus=null,modalKind=null;
const app=document.getElementById('app'),modal=document.getElementById('modal');
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=JSON.parse(raw);if(data.version!==1||!data.progress)return;for(const id of [1,2,3]){const source=data.progress[id];if(!source||typeof source!=='object')continue;const p=fresh(),allowed=CASE_DATA[id].evidence.map(e=>e.id);p.initialOpinion=['同意','存疑','不確定'].includes(source.initialOpinion)?source.initialOpinion:null;p.evidenceIds=Array.isArray(source.evidenceIds)?[...new Set(source.evidenceIds.filter(e=>allowed.includes(e)))]:[];p.selected=Array.isArray(source.selected)?[...new Set(source.selected.filter(e=>p.evidenceIds.includes(e)))]:[];p.flags=Array.isArray(source.flags)?[...new Set(source.flags.filter(e=>['experiment-id','corrected','roster-revealed','split','weighted','rate'].includes(e)))]:[];p.analyzed=source.analyzed===true;p.solved=source.solved===true;p.hintLevel=Number.isInteger(source.hintLevel)?Math.max(0,Math.min(3,source.hintLevel)):0;p.weight=Number.isFinite(source.weight)?Math.max(0,Math.min(100,source.weight)):50;gameState.caseProgress[id]=p;}}catch(e){if(e instanceof SyntaxError){toast('舊存檔無法讀取，已安全開啟新的調查。');}else storageFailure();}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,progress:gameState.caseProgress}));}catch{storageFailure();}updateCount();}
function storageFailure(){storageAvailable=false;document.getElementById('storage-warning').textContent='此瀏覽器目前無法儲存進度；本次仍可完整遊玩，關閉頁面後可能遺失。';}
function updateCount(){document.getElementById('solved-count').textContent=Object.values(gameState.caseProgress).filter(p=>p.solved).length;}
const progress=()=>gameState.caseProgress[gameState.activeCase];
const current=()=>CASE_DATA[gameState.activeCase];
function toast(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500);}
function found(id){const p=progress();if(p.evidenceIds.includes(id))return;p.evidenceIds.push(id);save();clearTimeout(stampTimer);document.getElementById('discovery').innerHTML=`<img class="discovery" src="${asset('stamp_evidence_found')}" alt="">`;stampTimer=setTimeout(()=>document.getElementById('discovery').innerHTML='',1500);toast(STORY[gameState.activeCase].discoveries[id]||('已收錄證物：'+current().evidence.find(e=>e.id===id).name));}
function flag(id){if(!progress().flags.includes(id))progress().flags.push(id);save();}
function setScene(scene){gameState.scene=scene;render();window.scrollTo(0,0);}
function render(){updateCount();if(gameState.scene==='intro')renderIntro();else if(gameState.scene==='desk')renderDesk();else renderCase();}
function renderIntro(){app.innerHTML=`<section class="intro scene"><div class="intro-seal" aria-hidden="true">機密案件<br>統計調查局<br>三案待查</div><div class="intro-inner"><div class="eyebrow">統計調查局 · 夜班偵探招募中</div><img class="intro-logo" src="${asset('title_statistics_crime_scene')}" alt="Statistics Crime Scene"><h1>統計犯罪現場</h1><p class="intro-quote">數據可能是真的，結論卻未必。</p><p class="muted">辦公桌上，有三份還沒說完的故事。<br>翻開案卷，看看報告留下了什麼，又藏起了什麼。</p><button class="primary" data-action="start">接受委託，開始調查 <span aria-hidden="true">→</span></button><div class="intro-foot">三宗疑案 · 每案約 3–5 分鐘 · 進度自動保存</div></div><div class="intro-detail">案件紀錄室 / 夜間開放<br>點擊探索　・　操作數據　・　以證據結案</div></section>`;}
function renderDesk(){const solved=Object.values(gameState.caseProgress).filter(p=>p.solved).length;app.innerHTML=`<section class="scene"><div class="desk-heading"><div><div class="eyebrow">偵探事務所 / 案件紀錄室</div><h1>${solved===3?'三份案卷，歸檔。':'辦公桌上，有三份還沒說完的故事。'}</h1><p>${solved===3?'那些最重要的線索，從來不只是一個漂亮的數字。':'翻開案卷，看看報告留下了什麼，又藏起了什麼。'}</p></div><span class="total-complete">${solved===3?'全部結案，可重返現場':'三案皆可自由調查'}</span></div><div class="desk" aria-label="可互動的偵探桌">${[1,2,3].map(id=>`<button class="prop folder${id}" data-action="case" data-id="${id}" aria-label="開啟案件 ${id}：${CASE_DATA[id].title}"><img src="${asset('casefile_'+pad(id)+'_closed')}" alt="">${gameState.caseProgress[id].solved?`<img class="solved-stamp" src="${asset('stamp_case_closed')}" alt="已結案">`:''}<span class="prop-label"><small>CASE ${pad(id)} · ${gameState.caseProgress[id].solved?'已結案':gameState.caseProgress[id].initialOpinion?'調查中':'未開封'}</small>${CASE_DATA[id].title}</span></button>`).join('')}<div class="desk-note"></div><button class="prop notebook-prop" data-action="notebook"><img src="${asset('notebook_closed')}" alt=""><span class="prop-label">偵探筆記<small>你找到的線索，都留在這裡</small></span></button><button class="prop typewriter-prop" data-action="desk-reports"><img src="${asset('typewriter_idle')}" alt=""><span class="prop-label">結案報告<small>要下結論，先把證據放上桌</small></span></button><button class="prop magnifier-prop" data-action="guide"><img src="${asset('magnifier')}" alt=""><span class="prop-label">調查指南<small>不知道看哪裡？看看局長便條</small></span></button></div><footer class="desk-footer"><span>報社等著更正，推薦書等著簽名，上市文案等著核稿。</span><span>點擊物件調查 · Esc 關閉文件</span></footer></section>`;}
function brief(id){return STORY[id].short(CASE_DATA[id]);}
function unlocked(e){return !e.requires||progress().evidenceIds.includes(e.requires)||progress().flags.includes(e.requires);}
function renderCase(){
 const d=current(),p=progress(),id=gameState.activeCase,s=STORY[id];
 const zones=id===1?[[7,48,21,19],[28,48,21,20],[28,72,21,18]]:id===2?[[6,37,26,22],[32,40,17,27],[9,60,30,24]]:[[11,36,19,26],[30,62,19,26],[9,63,20,26]];
 const hotspots=p.initialOpinion?d.evidence.map((e,i)=>unlocked(e)?'<button class="folder-hotspot" style="--x:'+zones[i][0]+'%;--y:'+zones[i][1]+'%;--w:'+zones[i][2]+'%;--h:'+zones[i][3]+'%" data-action="evidence" data-id="'+e.id+'" aria-label="翻閱左頁：'+e.name+'"><span>'+String(i+1).padStart(2,'0')+'</span><span class="hotspot-caption">'+e.name+'</span></button>':'').join(''):'';
 app.innerHTML='<section class="case-shell scene"><div class="case-top"><p class="eyebrow">CASE '+pad(id)+' / '+d.category+(p.solved?' / 已結案':'')+'</p><div><button class="text-button" data-action="director">局長批註</button><button class="text-button" data-action="hint">調查提示</button><button class="text-button" data-action="desk">← 偵探桌</button></div></div><div class="folder-pager"><button data-action="folder-side" data-side="left">← 左頁・證物</button><button data-action="folder-side" data-side="right">右頁・委託 →</button></div><div class="folder-viewport" aria-label="案件卷宗，可切換左右頁"><div class="folder-stage" data-case="'+id+'"><img class="folder-art" src="'+asset('casefile_'+pad(id)+'_open')+'" alt="打開的案件卷宗">'+hotspots+'<article class="case-brief ink"><header><span class="eyebrow">'+d.code+' · 委託來函</span><h1>'+d.title+'</h1></header><div class="case-copy" tabindex="0" role="region" aria-label="接案敘事，可捲動">'+brief(id).split('\n').map(t=>'<p>'+t+'</p>').join('')+'</div><div class="case-reading"><button class="public-report-link" data-action="public-report" aria-label="閱讀完整委託與新聞，開啟可捲動文件">閱讀完整委託／新聞 ↗</button></div>'+(s.fiction?'<p class="fiction-note">'+(s.fictionShort||s.fiction)+'</p>':'')+'<div class="opinion"><p>'+(s?.question||'這份報告，你會先留下什麼意見？')+'</p><div class="opinion-buttons">'+['同意','存疑','不確定'].map(o=>'<button data-action="opinion" data-value="'+o+'" aria-pressed="'+(p.initialOpinion===o)+'">'+opinionLabel(id,o)+'</button>').join('')+'</div></div></article></div></div><aside class="investigation"><div class="investigation-title"><h2>調查中的文件</h2><span class="muted">'+(p.initialOpinion?'點左頁標記，或抽出下方文件。':'先在右頁留下初步意見。')+'</span></div><div class="evidence-belt">'+(p.initialOpinion?d.evidence.map((e,i)=>unlocked(e)?'<button class="evidence-item '+(p.selected.includes(e.id)?'selected':'')+'" data-action="evidence" data-id="'+e.id+'"><span class="evidence-number">證物 '+String(i+1).padStart(2,'0')+'</span><strong>'+e.name+'</strong><small>'+(p.evidenceIds.includes(e.id)?p.selected.includes(e.id)?'已放上分析桌':'已拆閱・再次翻看':e.kind)+'</small>'+(p.evidenceIds.includes(e.id)?'<span class="checkmark" aria-label="已發現">✓</span>':'')+'</button>':'<button class="evidence-item locked" data-action="locked" data-id="'+e.id+'"><span class="evidence-number">證物 '+String(i+1).padStart(2,'0')+'</span><strong>尚待追查</strong><small>檢查上一份文件的附件</small></button>').join(''):'<div class="empty-clues">文件還封著。<br>'+s.waiting+'</div>')+'</div><div class="work-tools"><span class="clue-status">已收錄 '+p.evidenceIds.length+' / '+d.evidence.length+' 份 · 已選取 '+p.selected.length+' 份</span><button class="work-tool" data-action="analysis"><img src="'+asset('template_analysis_board')+'" alt=""><span>分析工作台<small>把選好的文件攤在一起</small></span></button><button class="work-tool" data-action="verdict"><img src="'+asset('typewriter_idle')+'" alt=""><span>撰寫結案報告<small>打字機已經裝好紙</small></span></button></div></aside></section>';
 folderSide(gameState.ui.folderSide||'right');
}
function openCase(id){if(!CASE_DATA[id])return;gameState.ui.folderSide='right';closeModal(false);gameState.activeCase=id;gameState.selectedEvidenceIds=progress().selected;setScene('case');}
function openModal(kind,title,body,cls=''){stopAnalysisObservers();
 if(['analysis','verdict','result'].includes(kind)){clearTimeout(toastTimer);document.getElementById('toast').textContent='';}
 if(modal.hidden)modalFocus=document.activeElement;
 modalKind=kind;gameState.ui.modal=kind;
 modal.innerHTML='<section class="document ink '+cls+' '+kind+(kind==='result'?' result-document':'')+'" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><button class="close-modal" data-action="close" aria-label="關閉文件">×</button><h2 id="dialog-title" class="document-title">'+title+'</h2><div class="document-body" role="region" aria-label="文件正文，可捲動" tabindex="0">'+body+'</div><footer class="document-footer"></footer></section>';
 // 只移動最底部的動作列；內容在原紙面內捲動，動作列始終留在紙上。
 const doc=modal.querySelector('.document'),actions=doc.querySelector('.doc-actions');
 if(actions){if(kind==='verdict'){const form=doc.querySelector('form');actions.querySelectorAll('button[type="submit"]').forEach(b=>b.setAttribute('form',form.id));}doc.querySelector('.document-footer').append(...actions.children);actions.remove();}
 modal.hidden=false;modal.scrollTop=0;app.inert=true;document.querySelector('.topbar').inert=true;document.body.style.overflow='hidden';doc.focus({preventScroll:true});
}
function closeModal(restore=true){stopAnalysisObservers();modal.hidden=true;modal.innerHTML='';modalKind=null;gameState.ui.modal=null;app.inert=false;document.querySelector('.topbar').inert=false;document.body.style.overflow='';if(gameState.activeCase&&gameState.scene==='case')renderCase();if(restore){if(modalFocus?.isConnected&&modalFocus.matches('button,a[href],input,summary,[tabindex]'))modalFocus.focus({preventScroll:true});else{const action=modalFocus?.dataset.action,id=modalFocus?.dataset.id;const previous=[...app.querySelectorAll('[data-action]')].find(el=>el.dataset.action===action&&el.dataset.id===id&&el.getClientRects().length);const target=previous||(gameState.activeCase?app.querySelector('[data-action="evidence"], [data-action="opinion"]'):app.querySelector('button'));target?.focus({preventScroll:true});}}}
function meta(left,right='調查局正式證物'){return `<div class="doc-meta"><span>${left}</span><span>${right}</span></div>`;}
function barChart(values,labels,unit,max=100,id='main-chart'){const ceiling=max||Math.max(...values)*1.15;const base=225,top=32,height=base-top,w=460,gap=w/(values.length+1);return `<svg id="${id}" data-values='${JSON.stringify(values)}' data-labels='${JSON.stringify(labels)}' data-max="${ceiling}" data-unit-label="${unit}" class="graphic" viewBox="0 0 510 280" role="img" aria-label="${labels.map((l,i)=>l+' '+num(values[i],2)+' '+unit).join('；')}"><text x="15" y="18" font-size="12" data-unit>${unit}</text>${[0,.5,1].map(t=>`<line data-grid="${t}" x1="48" x2="495" y1="${base-t*height}" y2="${base-t*height}" stroke="#b3a07c" stroke-dasharray="3 5"/><text x="39" y="${base-t*height+5}" text-anchor="end" font-size="12" data-tick="${t}">${num(ceiling*t,Number.isInteger(ceiling*t)?0:1)}</text>`).join('')}${values.map((v,i)=>{const x=30+gap*(i+1),h=v/ceiling*height;return `<rect class="bar" data-bar="${i}" x="${x-35}" y="${base-h}" width="70" height="${h}" fill="${i%2?'#974236':'#385951'}" rx="2"/><text data-value="${i}" x="${x}" y="${base-h-10}" text-anchor="middle" font-weight="bold">${num(v,Math.abs(v-Math.round(v))<.000001?0:1)}${unit==='能力測驗通過率（%）'?'%':''}</text><text data-label="${i}" x="${x}" y="253" text-anchor="middle" font-size="13">${labels[i]}</text>`;}).join('')}</svg>`;}
function resizeChart(svg){if(!svg.closest('.analysis'))return;if(svg.id==='p-chart'){resizePChart(svg);return;}if(!svg.dataset.values)return;
 const w=svg.clientWidth,h=svg.clientHeight;if(w<1||h<1)return;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 const values=JSON.parse(svg.dataset.values),labels=JSON.parse(svg.dataset.labels),max=Number(svg.dataset.max),unit=svg.dataset.unitLabel;
 const left=48,right=w-14,top=34,base=h-40,height=base-top,gap=(right-left)/values.length,bw=Math.min(92,gap*.48);
 svg.dataset.plotHeight=height;svg.dataset.plotWidth=right-left;svg.querySelector('[data-unit]').setAttribute('x',left);svg.querySelector('[data-unit]').setAttribute('y',17);
 svg.querySelectorAll('[data-grid]').forEach(line=>{const y=base-Number(line.dataset.grid)*height;for(const [key,value] of Object.entries({x1:left,x2:right,y1:y,y2:y}))line.setAttribute(key,value);});
 svg.querySelectorAll('[data-tick]').forEach(t=>{t.setAttribute('x',left-9);t.setAttribute('y',base-Number(t.dataset.tick)*height+5);});
 values.forEach((v,i)=>{const x=left+gap*(i+.5),bh=v/max*height,bar=svg.querySelector(`[data-bar="${i}"]`),text=svg.querySelector(`[data-value="${i}"]`),label=svg.querySelector(`[data-label="${i}"]`);for(const [key,val] of Object.entries({x:x-bw/2,y:base-bh,width:bw,height:bh}))bar.setAttribute(key,val);text.setAttribute('x',x);text.setAttribute('y',base-bh-9);label.setAttribute('x',x);label.setAttribute('y',base+27);label.textContent=labels[i];});
}
function updateBars(values,labels,unit,max){const svg=document.getElementById('main-chart');if(!svg)return;Object.assign(svg.dataset,{values:JSON.stringify(values),labels:JSON.stringify(labels),max,unitLabel:unit});svg.setAttribute('aria-label',labels.map((l,i)=>l+' '+num(values[i],2)+' '+unit).join('；'));svg.querySelector('[data-unit]').textContent=unit;svg.querySelectorAll('[data-tick]').forEach(t=>t.textContent=num(max*Number(t.dataset.tick),Number.isInteger(max*Number(t.dataset.tick))?0:1));values.forEach((v,i)=>svg.querySelector(`[data-value="${i}"]`).textContent=num(v,Math.abs(v-Math.round(v))<.000001?0:1)+(unit.includes('能力測驗通過率')?'%':''));resizeChart(svg);queueAnalysisLayout();}
function resizePChart(svg){const w=svg.clientWidth,h=svg.clientHeight;if(!w||!h)return;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.dataset.plotHeight=h-72;svg.dataset.plotWidth=w-120;
 const set=(el,attrs)=>{for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);};
 svg.querySelector('text').setAttribute('x',44);
 svg.querySelectorAll('[data-p-grid]').forEach(el=>set(el,{x1:pX(Number(el.dataset.pGrid)),x2:pX(Number(el.dataset.pGrid)),y1:28,y2:h-28}));
 svg.querySelectorAll('[data-p-tick]').forEach(el=>set(el,{x:pX(Number(el.dataset.pTick)),y:h-6}));
 current().pvalues.forEach((v,i)=>{const y=38+i*(h-82)/11;set(svg.querySelector(`[data-mode-label="${i}"]`),{x:8,y:y+5});set(svg.querySelector(`[data-p-row="${i}"]`),{x1:44,x2:w-76,y1:y,y2:y});set(svg.querySelector(`[data-p-index="${i}"]`),{cx:pX(v),cy:y});set(svg.querySelector(`[data-p-value="${i}"]`),{x:w-61,y:y+5});});
 const threshold=current().alpha/(progress().view==='corrected'?current().modes.length:1);set(svg.querySelector('#threshold-line'),{x1:pX(threshold),x2:pX(threshold),y1:27,y2:h-28});
}

function evidenceBody(id){const d=current(),p=progress();if(gameState.activeCase===1){
 if(id==='complaints')return `${meta('政治大學校務處 / 客訴受理簿')}<p class="doc-lead">協調會附件，列的是受理件數。</p><p>「校園多處販賣機的購物客訴件數由第 1 週 ${d.complaints[0]} 件增至第 2 週 ${d.complaints[1]} 件。請在協調會前評估營運服務。」</p>${barChart(d.complaints,d.weeks,'購物客訴件數（件）',Math.max(...d.complaints)*1.25)}<p class="note">教學資料設定：兩期皆為完整 ${d.days} 天。一筆受理客訴對應一筆交易，同筆交易重複申訴已合併。情節與數據均屬虛構。</p><p class="handwritten">右上角有一行鉛筆字：「連同稽核員留下的信封送交調查局。」</p>`;
 if(id==='audit')return `${meta('稽核員 / 隨函備忘錄')}<p class="doc-lead">信封沒有署名，封口卻保存得很完整。</p><p class="handwritten">「購物客訴件數我核過了。只是給刊物的附件，漏掉廠商的營運紀錄。校內各處機台是同一套服務，請把相同範圍的資料放在一起看。」</p><p>信封裡有張折成三折的明細。你把它從封口慢慢抽出。</p><button class="clue-button" data-action="evidence" data-id="transactions">抽出信封裡的交易明細 →</button>`;
 return `${meta('設備商 / 兩週完成交易明細')}<p class="reveal-note">信封裡是兩週的交易紀錄：${num(d.transactions[0])} 筆與 ${num(d.transactions[1])} 筆。數字比報紙上的大得多。</p><table class="data-table"><caption>同一營運範圍、兩個完整統計週</caption><thead><tr><th>期間</th><th>完成交易</th><th>天數</th></tr></thead><tbody>${d.weeks.map((w,i)=>'<tr><td>'+w+'</td><td>'+num(d.transactions[i])+'</td><td>'+d.days+'</td></tr>').join('')}</tbody></table>${directorNote('兩週的購物客訴件數與交易筆數，範圍對得上。現在，把它們放在一起比較。')}<p>把購物客訴件數表和交易紀錄一起放上分析桌。兩份文件的日期，正好對得上。</p>`;}

if(gameState.activeCase===2){
 if(id==='letter')return `${meta('匿名來信 / 未署名')}<div class="handwritten"><p>「名單還沒定，請再看一次。你們把兩種不同難度的能力測驗混在一起比了。」</p><p>「先看看誰去考了哪一份考卷。我不方便署名，請去核對原始名冊。」</p></div><p class="note">紙背有測驗中心的收件戳。信中的指控，尚待資料核實。</p><p>局長把原始名冊借了過來。最右邊的欄位，被裝訂折角遮住一半。</p>${directorNote('先把那一欄攤開。信上說的，要用名冊核實。')}`;
 if(id==='roster'){
  if(!p.flags.includes('roster-revealed'))return `${meta('測驗中心 / 原始名冊')}<p class="doc-lead">名冊的折角，把什麼藏住了？</p><p>兩校各有 ${num(d.groups.reduce((a,g)=>a+g.total[0],0))} 位參加者。姓名與是否通過都看得清楚，最後一欄只露出「題組」兩字。</p><table class="data-table"><tr><th>學院</th><th>是否通過</th><th>折角下的欄位</th></tr><tr><td>A / B</td><td>已記錄</td><td>題組 ▧ ▧</td></tr></table><button class="clue-button" data-action="reveal-roster">⌕ 拿起放大鏡，展開名冊折角</button>`;
  return `${meta('名冊 / 依測驗難度重新彙整')}<p class="reveal-note">一欄原本不起眼的「題組難度」，把看似整齊的總榜切成了兩張表。</p><p>原始欄位「Exam Level / 測驗難度」，只分基礎與高階兩組。星橋為 A，晨星為 B。</p>${groupTable(d)}<p class="note">每人只考一組；同題組跨學院使用相同試卷與及格標準。這是原始分組紀錄，沒有讓同一批學生重考。</p>${directorNote('分組裡誰比較高？兩校又各有多少人考了哪一組？這兩個問題得一起回答。')}`;
 }
 return `${meta('測驗中心 / 題組配置清冊')}<p class="doc-lead">名冊後面，還有一張人數配置表。</p><table class="data-table"><thead><tr><th>題組</th>${d.schools.map(s=>'<th>'+s+'</th>').join('')}</tr></thead><tbody>${d.groups.map(g=>'<tr><td>'+g.label+'</td>'+g.total.map((v,i)=>'<td>'+v+' 人（'+pct(v/d.groups.reduce((a,r)=>a+r.total[i],0))+'）</td>').join('')+'</tr>').join('')}</tbody></table><p>星橋有較多人考基礎題，晨星有較多人考高階題。清冊上的分配，和你原本以為的並不一樣。</p><p class="note">選取名冊與配置表。先保留各組的能力測驗通過率，再到分析桌試算相同的題組比例。</p>`;

function result(){
 const id=gameState.activeCase,d=current(),p=progress(),s=STORY[id];let evidence='',concept='';
 if(id===1){const rates=d.complaints.map((v,i)=>v/d.transactions[i]);evidence=`<p>購物客訴件數由 ${d.complaints[0]} 件增為 ${d.complaints[1]} 件，交易也從 ${num(d.transactions[0])} 筆增至 ${num(d.transactions[1])} 筆。每千筆交易購物客訴，則由 <strong>${rates[0]*d.per} 件降為 ${rates[1]*d.per} 件</strong>，購物客訴／交易比例 ${pct(rates[0])} → ${pct(rates[1])}。</p><p>這支持以交易量為分母的客訴比例下降；仍不能證明設備本身品質改善。第 2 週的 ${d.complaints[1]} 件購物客訴仍須逐件處理。</p>`;concept=`<p>${d.complaints[1]} 是 ${d.complaints[0]} 的 ${num(d.complaints[1]/d.complaints[0])} 倍：變成原來的 ${pct(d.complaints[1]/d.complaints[0])}，代表增加 ${pct(d.complaints[1]/d.complaints[0]-1)}，不是增加 300%。比較比例時，分母必須一起交代。</p>`;}
 else if(id===2){const totals=d.groups[0].total.map((_,i)=>d.groups.reduce((a,g)=>a+g.total[i],0));evidence=`<p>星橋的 ${pct(overall(d,0))}、晨星的 ${pct(overall(d,1))} 都是真的。星橋有 ${pct(d.groups[0].total[0]/totals[0])} 的學生考基礎題，晨星只有 ${pct(d.groups[0].total[1]/totals[1])}；總榜把不同的難度組成混在一起。</p><p>基礎題 A ${pct(d.groups[0].pass[0]/d.groups[0].total[0])}、B ${pct(d.groups[0].pass[1]/d.groups[0].total[1])}；高階題 A ${pct(d.groups[1].pass[0]/d.groups[1].total[0])}、B ${pct(d.groups[1].pass[1]/d.groups[1].total[1])}。共同權重 ${d.defaultWeight}%／${100-d.defaultWeight}% 時，得到 <strong>A ${pct(weighted(d,0,d.defaultWeight/100))}、B ${pct(weighted(d,1,d.defaultWeight/100))}</strong>。這仍無法判定哪所學院的教學造成較好的結果。</p>`;concept='<p>整體與分組排名相反，是辛普森悖論。總能力測驗通過率是各組能力測驗通過率依人數占比加權的結果。共同權重是一項比較假設，沒有讓同一批學生重考，也沒有增加因果證據。</p>';}
 else{evidence=`<p>日誌與通訊顯示，公司看完 ${d.modes.length} 次結果後才選 A 發表。A 的 p = ${d.pvalues[0].toFixed(3)} 在單次 ${d.alpha} 門檻下顯著；Bonferroni 的門檻為 ${d.alpha}/${d.modes.length} ≈ <strong>${(d.alpha/d.modes.length).toFixed(5)}</strong>，沒有任何模式達到。</p><p><strong>未達顯著不等於無效。</strong>現有資料不足以支撐廣告宣稱。後續應事先指定 A，用新的獨立樣本重做確認性實驗，報告效果大小與信賴區間。</p>`;concept=`<p>僅在<strong>所有虛無假設皆為真</strong>、${d.modes.length} 次檢定互相獨立，且各自使用 ${pct(d.alpha)} 門檻時，至少一次假陽性的機率為 1 − (1 − ${d.alpha})<sup>${d.modes.length}</sup> ≈ ${num((1-(1-d.alpha)**d.modes.length)*100,2)}%。這不是產品無效的機率。</p>`;}
 openModal('result',s.resultTitle,`<div class="result"><div class="eyebrow">${d.code} / 案件處置・虛構劇情</div><p class="result-disposition"><img class="result-stamp" src="${asset('stamp_case_closed')}" alt="已結案">${s.outcome}</p><div class="result-explanation">${evidence}</div><div class="comparison"><div><small>最初的建議</small><p>${opinionLabel(id,p.initialOpinion)}</p></div><div><small>簽署的結論</small><p>${s.after}</p></div></div><details class="concept-note"><summary>附註：${d.principle}</summary>${concept}</details><div class="badge-award"><img class="badge" src="${asset('badge_case'+pad(id))}" alt="${d.badge}徽章"><div><span class="eyebrow">${d.english}</span><h3>${d.badge}</h3><p>${s.closing}</p></div></div><div class="doc-actions"><button class="primary" data-action="desk">返回偵探桌</button><button class="secondary" data-action="replay" data-id="${id}">重新調查此案</button></div></div>`);
}
function notebook(reports=false){openModal('notebook',reports?'案件結案報告':'偵探筆記',`${meta('私人調查紀錄',`${Object.values(gameState.caseProgress).filter(p=>p.solved).length} / 3 案已結案`)}<p class="note">你翻過的文件，已按案件夾在這裡。想重回現場，翻到該案繼續查；已獲徽章會留在扉頁。</p><ul class="notebook-list">${[1,2,3].map(id=>{const d=CASE_DATA[id],p=gameState.caseProgress[id];return `<li><div class="notebook-row">${p.solved?`<img src="${asset('badge_case'+pad(id))}" alt="${d.badge}">`:''}<div><span class="eyebrow">CASE ${pad(id)} · ${p.solved?'已取得徽章':p.initialOpinion?'調查中':'未開封'}</span><h3>${d.title}</h3><p>最初的建議：${opinionLabel(id,p.initialOpinion)} · ${p.analyzed?'已完成分析':'待完成分析'}</p></div></div><p class="note">${p.evidenceIds.length?'已收錄：'+p.evidenceIds.map(e=>d.evidence.find(x=>x.id===e)?.name).filter(Boolean).join('、'):'尚無證物，從拆封案件開始。'}</p><button class="secondary" data-action="case" data-id="${id}">繼續調查</button> ${p.solved?`<button class="secondary" data-action="archived" data-id="${id}">閱讀結案解釋</button> <button class="text-button" style="color:#7f3f2b" data-action="replay" data-id="${id}">重新調查</button>`:''}</li>`;}).join('')}</ul>`,'notebook');}
function hint(){const p=progress(),d=current(),id=gameState.activeCase;p.hintLevel=Math.min(3,p.hintLevel+1);save();let clue='';
 if(!p.initialOpinion)clue='先在右頁的建議書上留一個初步意見。三個按鍵都可以，之後還能改。';
 else if(id===1)clue=!p.evidenceIds.includes('complaints')?'翻開左頁的購物客訴件數表。受理簿右上角，還有人留了字。':!p.evidenceIds.includes('audit')?'購物客訴件數表提到稽核員的信封。點開第二份文件，看看封口裡有什麼。':!p.evidenceIds.includes('transactions')?'抽出信封裡的交易明細，再把它與購物客訴件數表放在同一張分析桌上。':!p.analyzed?'兩份文件底部都有「選取證物」。選好購物客訴件數表與交易紀錄後，點分析工作台，再切到每千筆交易。':'打字機在右側。把比較用的單位寫清楚，附上日期相同的兩份紀錄。';
 else if(id===2)clue=!p.evidenceIds.includes('letter')?'先拆開左頁那封匿名信。別替寫信的人補話，看看紙上究竟說了什麼。':!p.evidenceIds.includes('roster')?'翻開名冊，按文件裡的放大鏡，展開遮住最後一欄的折角。':!p.evidenceIds.includes('config')?'名冊後面還有題組配置表。查兩校各有多少人考了哪種難度。':!p.selected.includes('roster')||!p.selected.includes('config')?'把名冊與配置表都選入分析桌；它們分別記錄能力測驗通過率和人數比例。':!p.flags.includes('split')?'在分析桌按「依難度拆分」。先看兩張分組表的名次。':!p.flags.includes('weighted')?'再按「共同權重」，移動基礎題組比例滑桿。這是比較假設，不是改寫原始名冊。':'把補助推薦交回打字機。寫清楚總榜受什麼影響，也留意資料沒有證明的事。';
 else clue=!p.evidenceIds.includes('summary')?'先讀上市新聞稿的研究附件。右上角也要看，別只停在標題。':!p.flags.includes('experiment-id')?'檢查摘要右上角 FX-A 的檔案編號。按它，去資料櫃找對應紀錄。':!p.evidenceIds.includes('log')?'資料櫃已打開。把完整日誌翻出來，別只抽走 A 那一張。':!p.analyzed?'選取完整日誌，送上分析桌。切換 Bonferroni，檢查多次比較的門檻。':!p.evidenceIds.includes('memo')?'回到案卷，第三份文件已送到：研究部與行銷部的往返信件。':'把研究日誌和內部通訊一起附上。下一步試驗，要先寫下想確認的模式。';
 openModal('hint','局長留的下一步',`${meta(d.code+' / 第 '+p.hintLevel+' 次便條')}<p class="hint-copy">${clue}</p><div class="doc-actions"><button class="secondary" data-action="close">照著查下去</button></div>`,'memo');
}
function replay(id){const old=gameState.caseProgress[id];gameState.caseProgress[id]=fresh();gameState.caseProgress[id].solved=old.solved;save();openCase(id);toast('已重開此案的調查紀錄；所有已獲徽章均保留。');}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;switch(action){case 'start':case 'desk':closeModal(false);gameState.activeCase=null;setScene('desk');break;case 'case':openCase(Number(id));break;case 'close':closeModal();break;case 'notebook':notebook();break;case 'desk-reports':notebook(true);break;case 'guide':openModal('guide','給偵探的調查指南',`${meta('新進調查員 / 操作手冊')}<p class="doc-lead">局長的便條，壓在放大鏡下面。</p><ol><li>翻開一份案卷，在右頁留下初步建議。</li><li>點開證物。留意信封、頁腳或被遮住的欄位，取得新線索。</li><li>按文件底部的「選取證物」，把相關資料放上分析工作台。</li><li>切換圖表或調整滑桿，看見比較方式如何改變結論。</li><li>點擊打字機，選擇結論與證據。答錯可以回頭調查。</li></ol><p class="note">Tab 移動焦點，Enter／空白鍵操作按鈕，Esc 關閉文件。手機可全程點擊，不需要拖曳。進度自動儲存在此瀏覽器。</p><button class="secondary" data-action="close">明白，開始查案</button>`,'memo');break;case 'director':director();break;case 'folder-side':folderSide(b.dataset.side);break;case 'public-report':publicReport();break;case 'opinion':progress().initialOpinion=b.dataset.value;save();renderCase();toast('初步意見留在案卷上了。接著，拆開左頁的第一份文件。');break;case 'evidence':showEvidence(id);break;case 'locked':hint();break;case 'select-evidence':{const selected=progress().selected;const at=selected.indexOf(id);if(at<0)selected.push(id);else selected.splice(at,1);gameState.selectedEvidenceIds=selected;save();b.textContent=selected.includes(id)?'已選取 ✓・移出分析桌':'選取證物，加入分析桌';toast(selected.includes(id)?'證物已加入分析桌。可收起文件，繼續追查。':'已將證物移出分析桌。');break;}case 'reveal-roster':flag('roster-revealed');showEvidence('roster');break;case 'experiment-id':flag('experiment-id');showEvidence('log');break;case 'analysis':analysis();break;case 'mode1':mode1(b.dataset.mode);break;case 'mode2':mode2(b.dataset.mode);break;case 'mode3':updateP(b.dataset.mode);break;case 'verdict':verdict();break;case 'hint':hint();break;case 'replay':replay(Number(id));break;case 'archived':openCase(Number(id));result();break;}});
document.addEventListener('input',event=>{if(event.target.id==='weight')updateWeight(event.target.value);});
document.addEventListener('submit',event=>{if(event.target.id==='verdict-form'){event.preventDefault();submitVerdict(event.target);}});
document.addEventListener('keydown',event=>{if(modal.hidden)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const list=[...modal.querySelectorAll('button,input,summary,a[href],[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length),first=list[0],last=list[list.length-1];if(!first)return;if(event.shiftKey&&(document.activeElement===first||document.activeElement===modal.querySelector('.document'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===modal.querySelector('.document'))){event.preventDefault();first.focus();}}});
modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
// 圖片優化檔失效時回退原始 PNG；原始素材從不改寫。
document.addEventListener('error',event=>{const img=event.target;if(img.tagName!=='IMG'||img.dataset.fallback)return;img.dataset.fallback='true';const name=img.src.split('/').pop().replace('.webp','');const folder=name.startsWith('badge_')||name.startsWith('stamp_')||name.startsWith('title_')?'ui':name.startsWith('template_')?'templates':'props';img.src='./asset/'+folder+'/'+name+'.png';},true);
load();render();
</script>
